{% extends "base.html" %}
{% block title %}Setup — Routine Runner{% endblock %}
{% block content %}
<main class="setup">
  <h1>Welcome</h1>
  <p>This is the first device. Name it to claim the household.</p>
  <form method="post" action="/setup/claim" class="claim-form">
    <input type="hidden" name="token" value="{{ token }}">
    <label>Device name <input name="label" required placeholder="Mum's phone"></label>
    <button class="btn" type="submit">Claim</button>
  </form>
</main>
{% endblock %}
