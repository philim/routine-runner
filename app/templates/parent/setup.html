{% extends "auth_base.html" %}
{% block title %}Setup — Routine Runner{% endblock %}
{% block auth_content %}
<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h1 class="card-title text-2xl">Welcome</h1>
    <p class="text-base-content/60">This is the first device. Name it to claim the household.</p>
    <form method="post" action="/setup/claim" class="mt-3 space-y-3">
      <input type="hidden" name="token" value="{{ token }}">
      <label class="form-control">
        <span class="label-text">Device name</span>
        <input name="label" required placeholder="Mum's phone" class="input input-bordered w-full">
      </label>
      <label class="form-control">
        <span class="label-text">Login email <span class="text-base-content/50">(optional)</span></span>
        <input type="email" name="email" autocomplete="email" placeholder="you@example.com"
               class="input input-bordered w-full">
        <span class="label-text-alt text-base-content/50 mt-1">Used for /parent OTP login</span>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Claim</button>
    </form>
  </div>
</div>
{% endblock %}
