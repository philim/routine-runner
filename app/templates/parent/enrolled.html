{% extends "auth_base.html" %}
{% block title %}Enrolled{% endblock %}
{% block auth_content %}
<div class="card bg-base-100 shadow-xl">
  <div class="card-body items-center text-center">
    <span class="text-4xl" aria-hidden="true">✅</span>
    <h1 class="card-title text-2xl">Device enrolled</h1>
    <p><strong>{{ device.label }}</strong> is now a
      <span class="badge badge-primary">{{ device.role }}</span> device.</p>
    {% if device.role == "parent" %}
      <a class="btn btn-primary btn-block mt-2" href="/">Go to dashboard</a>
    {% else %}
      <a class="btn btn-primary btn-block mt-2" href="/kiosk">Open kiosk</a>
    {% endif %}
  </div>
</div>
{% endblock %}
